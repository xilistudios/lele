<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lele Desktop</title>
  <style>
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #f0883e;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Ubuntu", "Cantarell", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .brand {
      text-align: center;
    }
    .brand .logo {
      font-size: 72px;
      line-height: 1;
      display: block;
    }
    .brand h1 {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .status {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(240, 136, 62, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="brand">
    <span class="logo">🦞</span>
    <h1>Lele</h1>
    <div class="status">
      <div class="spinner"></div>
      <p id="status">Starting backend…</p>
    </div>
  </div>
</body>
</html>
