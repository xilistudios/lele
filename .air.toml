# Config file for Air in TOML format

# Working directory
root = "."
tmp_dir = "tmp"

[build]
  # Just plain old go build.
  cmd = "go build -o ./tmp/main ./cmd/lele"
  # Binary file yields from `cmd`.
  bin = "./tmp/main"
  # Customize binary options.
  full_bin = "./tmp/main gateway"
  # Watch these filename extensions.
  include_ext = ["go", "tpl", "html", "yaml", "json"]
  # Ignore these filename extensions or directories.
  exclude_dir = ["assets", "tmp", "vendor", "web", "workspace", "build", ".git", ".codeindex", ".zed"]
  # Watch these directories if you specified.
  include_dir = []
  # Exclude files.
  exclude_file = []
  # Exclude specific regular expressions.
  exclude_regex = ["_test.go"]
  # Exclude unchanged files.
  exclude_unchanged = true
  # Follow symlink for directories
  follow_symlink = true
  # This log file places in your tmp_dir.
  log = "air.log"
  # It's not necessary to trigger build each time file changes if it's too frequent.
  delay = 1000 # ms
  # Stop running old binary when build errors occur.
  stop_on_error = true
  # Send Interrupt signal before killing process.
  send_interrupt = true
  # Delay after sending Interrupt signal.
  kill_delay = "500ms"

[log]
  # Show log time
  time = true
  # Only show main log (not build log)
  main_only = false

[color]
  # Customize each part's color. If no color found, use the default theme.
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true
