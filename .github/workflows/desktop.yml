name: Desktop

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - "cmd/lele/**"
      - "pkg/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Build web app
        run: cd web && bun run build

      - name: Copy web dist for embed
        run: rm -rf cmd/lele/web && mkdir -p cmd/lele/web && cp -R web/dist cmd/lele/web/dist

      - name: Copy workspace for embed
        run: rm -rf cmd/lele/workspace && mkdir -p cmd/lele/workspace && cp -R workspace/. cmd/lele/workspace/

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./pkg/server/ ./pkg/lockfile/ ./pkg/channels/ ./cmd/lele/

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri"

      - name: Build sidecar
        shell: bash
        run: bash desktop/scripts/build-sidecar.sh --target ${{ matrix.target }}

      - name: Build desktop app
        shell: bash
        run: |
          cd desktop
          bun install
          bun run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lele-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/*
          if-no-files-found: warn