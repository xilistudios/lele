name: Desktop

on:
  push:
    # `v*` tags are built by release.yml (Create Tag and Release), which also
    # attaches the bundles to the GitHub release. `desktop-v*` stays here for
    # desktop-only builds.
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - "cmd/lele/**"
      - "pkg/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Build web app
        run: cd web && bun run build

      - name: Copy web dist for embed
        run: rm -rf cmd/lele/web && mkdir -p cmd/lele/web && cp -R web/dist cmd/lele/web/dist

      - name: Copy workspace for embed
        run: rm -rf cmd/lele/workspace && mkdir -p cmd/lele/workspace && cp -R workspace/. cmd/lele/workspace/

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./pkg/server/ ./pkg/lockfile/ ./pkg/channels/ ./cmd/lele/

  build:
    name: Desktop bundles
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ github.ref }}
