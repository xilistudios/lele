name: Update Model Catalog

on:
  schedule:
    # Weekly Monday 06:17 UTC (offset from :00 to reduce thundering herd)
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-model-catalog
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh catalog from models.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate catalog
        run: python3 scripts/update_model_catalog.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- catalog/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Catalog changes detected:"
            git diff --stat -- catalog/
          fi

      - name: Collect summary
        if: steps.diff.outputs.changed == 'true'
        id: summary
        run: |
          providers=$(python3 -c "import json; print(len(json.load(open('catalog/index.json'))['providers']))")
          models=$(python3 -c "import json; d=json.load(open('catalog/index.json')); print(sum(p.get('model_count',0) for p in d['providers'].values()))")
          updated=$(python3 -c "import json; print(json.load(open('catalog/index.json')).get('updated_at',''))")
          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "updated=$updated" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            catalog/**
          branch: chore/update-model-catalog
          delete-branch: true
          commit-message: |
            chore(catalog): refresh model catalog from models.dev

            Updated ${{ steps.summary.outputs.updated }}
            Providers: ${{ steps.summary.outputs.providers }}
            Models: ${{ steps.summary.outputs.models }}
          title: "chore(catalog): refresh model catalog from models.dev"
          body: |
            ## Summary
            Automated refresh of `catalog/` from [models.dev](https://models.dev).

            | | |
            |---|---|
            | Updated at | `${{ steps.summary.outputs.updated }}` |
            | Providers | ${{ steps.summary.outputs.providers }} |
            | Models | ${{ steps.summary.outputs.models }} |

            Clients download these files at runtime (`lele models refresh` or gateway start).
            Regenerated by `scripts/update_model_catalog.py`.

            ## Verification
            - [x] Catalog files regenerated from models.dev
            - [ ] CI green
          labels: |
            dependencies
            catalog
