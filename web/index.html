<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="theme-color-meta" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Lele Client</title>
    <!-- Theme init must run before first paint; it is an external script (not
         inline) so the server CSP can forbid 'unsafe-inline' in script-src
         (WEB-M13). Synchronous loading preserves the pre-paint timing. -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-background-primary text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
 </html>
